# Servicio REST de órdenes
quarkus.http.port=8082
quarkus.http.host=0.0.0.0

# Base de datos exclusiva del microservicio de órdenes.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:app}
quarkus.datasource.password=${DB_PASSWORD:app}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/ordenes_db}

# Crea o actualiza las tablas al iniciar. Para producción, usar migraciones.
quarkus.hibernate-orm.database.generation=update

# URL del catálogo; en el laboratorio se configura con la IP del equipo de productos.
quarkus.rest-client.productos-api.url=${PRODUCTOS_URL:http://localhost:8081}
